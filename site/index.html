   or pose (the detector and a keypoint network), each in a folder of its own */

const METRIC = { detect: "mDetect", segment: "mSegment", pose: "mPose" };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f3 = (v) => (typeof v === "number" ? v.toFixed(3) : "—");
function prettyName(id, title) {
  if (id.startsWith("rf100-")) {                     // rf100-chess-pieces-mjzgj -> Chess pieces
    let n = id.slice(6).replace(/-(?=[a-z0-9]{5}$)(?=.*\d)[a-z0-9]{5}$/, "");
    n = n.replace(/-/g, " ").replace(/\bx ray\b/i, "X-ray").replace(/\bmri\b/i, "MRI").replace(/\bpcb\b/i, "PCB");
    return n.charAt(0).toUpperCase() + n.slice(1);
  }
  return title.split(" (")[0].replace(" Dataset", "");
}
function shortLicence(text) {
  const s = String(text || "").trim(); const head = s.split(/ \(|;/)[0].trim();
  return head === s ? head : head + " *";
}
function fmtSize(n) {
  if (!n) return ""; const u = ["B", "KB", "MB", "GB"]; let i = 0;
  while (n >= 1000 && i < 3) { n /= 1000; i++; }
  return (n >= 100 || !i ? n.toFixed(0) : n.toFixed(1)) + " " + u[i];
}
let toastTimer;
function toast(s) { const e = $("toast"); e.textContent = s; e.classList.add("on");
  const top = $("detail").open ? $("detail") : document.body; if (e.parentNode !== top) top.append(e);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove("on"), 1600); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const a = document.createElement("textarea"); a.value = text; document.body.append(a); a.select();
    try { document.execCommand("copy"); } catch {} a.remove(); }
  toast(t("copied"));
}

/* ---------- code with tabs ---------- */
function highlight(code) {
  return esc(code)
    .replace(/(^|\n)(#[^\n]*)/g, '$1<span class="c">$2</span>')
    .replace(/(  #[^\n]*)/g, '<span class="c">$1</span>')
    .replace(/(&quot;[^&]*?&quot;)/g, '<span class="s">$1</span>')
    .replace(/\b(from|import)\b/g, '<span class="k">$1</span>');
}
function term(id, tabs) {
  const box = $(id);
  box.dataset.tabs = JSON.stringify(tabs);
  const on = Math.min(Number(box.dataset.on || 0), tabs.length - 1);
  box.innerHTML = `<div class="tabs">${tabs.map((tb, i) =>
    `<button type="button" class="db${i === on ? " on" : ""}" data-i="${i}">${esc(tb[0])}</button>`).join("")}</div>
    <div class="code"><pre>${highlight(tabs[on][1])}</pre><button type="button" class="db copy">${esc(t("copy"))}</button></div>`;
  box.dataset.on = on;
}
document.addEventListener("click", (e) => {
  const box = e.target.closest(".term"); if (!box) return;
  const tabs = JSON.parse(box.dataset.tabs || "[]");
  const tb = e.target.closest(".tabs .db");
  if (tb) { box.dataset.on = tb.dataset.i; term(box.id, tabs); return; }
  if (e.target.closest(".copy")) copy(tabs[Number(box.dataset.on || 0)][1]);
});
/* the downloaded file first (on-device, offline), the hub name as a comment */
const fileFirst = (file, hub, zipped = false) => `# ${t(zipped ? "cUnzip" : "cFile")}\n${file}\n# ${t("cHub")}\n# ${hub}`;
function pythonCode(hub, file, task = "detect", head = HEAD[task]) {
  const arg = task === "detect" ? "" : `, task="${task}"`;
  const beside = !!head;
  return `from easydetect import Detector\n\n` + fileFirst(`model = Detector("${file}"${arg})`, `model = Detector("${hub}")`, beside)
    + `\n\nresult = model("photo.jpg")[0]\nresult.show()`;
}
function heroTerm() {
  term("hero-term", [
    [t("python"), "# pip install -U easydetect\n" + pythonCode("hub:taco/ed-s-640", "taco-ed-s-640.onnx")],
    [t("cli"), `pip install -U easydetect\n\n# ${t("cWebcam")}\n` + fileFirst("easydetect predict model=taco-ed-s-640.onnx source=0", "easydetect predict model=hub:taco/ed-s-640 source=0")
      + `\n\n# ${t("cList")}\neasydetect hub search=plant`],
    [t("pi"), `pip install easydetect\n\nfrom easydetect import Detector\n` + fileFirst(`model = Detector("coco-ed-s-320-int8.onnx", backend="onnxruntime")`, `model = Detector("hub:coco/ed-s-320-int8", backend="onnxruntime")`)
      + `\nmodel("photo.jpg")[0].save("out.jpg")`],
  ]);
}

/* ---------- data ---------- */
async function load() {
  $("grid").innerHTML = '<div class="skel"></div>'.repeat(8);
  try {
    const res = await fetch(`${RAW}/index.json`, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const by = new Map();
    for (const [key, m] of Object.entries(await res.json())) {
      const [id, variant] = key.split("/");
      if (!by.has(id)) by.set(id, { id, variants: [], meta: m });
      const task = m.task || "detect";
      by.get(id).variants.push({ key, name: variant, ...m, task,
        score: m.score ?? m.map50_95, score_int8: m.score_int8 ?? m.map50_95_int8 });
    }
    S.datasets = [...by.values()].map((d) => {
      d.variants.sort((a, b) => TASKS.indexOf(a.task) - TASKS.indexOf(b.task) || (a.imgsz || 0) - (b.imgsz || 0));
      d.tasks = TASKS.filter((k) => d.variants.some((v) => v.task === k));
      d.meta = (d.variants.find((v) => v.task === "detect") || d.variants[0]);
      d.title = d.meta.title || d.id; d.name = prettyName(d.id, d.title); d.rf = d.id.startsWith("rf100-") ? "RF100" : d.id.startsWith("rf100vl-") ? "RF100-VL" : "";
      d.category = d.meta.category || "Other";
      d.classes = Object.values(d.meta.classes || {}).map(String);
      d.of = (task, size) => d.variants.find((v) => v.task === task && v.imgsz === size);
      return d;
    });
    renderAll();
    const want = decodeURIComponent(location.hash.slice(1));

/* ---------- a small try inside the detail: the model on the webcam or a picture
   (js/engine.js, as try.html); the model stays loaded while the detail shows it ---------- */
let engine = null, mini = null;
const miniEl = (id) => document.getElementById(id);
function miniSay(s) { const e = miniEl("miniStat"); if (e) e.textContent = s; }
async function miniModel() {
  const { d, v } = current;
  if (mini && mini.key === v.key && !mini.error) return mini.ready;
  miniStop(true);
  const me = mini = { key: v.key, cam: 0 };
  me.ready = (async () => {
    const E = engine = engine || await import("./js/engine.js");
    miniSay(t("miniRt"));
    let ep = "auto"; try { ep = localStorage.getItem("try.ep") || "auto"; } catch {}
    await E.runtime(ep);
    const base = `${RAW}/${v.key.split("/").map(encodeURIComponent).join("/")}/`;
    const get = (u, name) => E.fetchModel(u, (a, b) => { if (mini === me) miniSay(`${t("miniLoad")} · ${name} ${b ? Math.round(a / b * 100) + "%" : (a / 1e6).toFixed(0) + " MB"}`); });
    const n = stemOf(d, v), head = headOf(d, v);
    const det = await get(base + `${n}.onnx`, `${n}.onnx`);
    const h = head ? await get(base + head, head) : null;
    const enc = v.task === "segment" ? await get(E.ENCODER, "encoder.onnx") : null;
    if (mini === me) miniSay(t("miniRt"));
    const model = await E.Model.create({ det, head: h, task: v.task, encoder: enc, prefer: E.preferred(),
      names: Object.fromEntries(Object.entries(d.meta.classes || {}).map(([k, x]) => [Number(k), x])) });
    if (mini !== me) { model.release(); return null; }
    me.model = model; miniSay(me.note || t("tryNote"));   // a camera's trouble stays said
    return model;
  })().catch((e) => { me.error = true; if (mini === me) miniSay(t("miniErr") + (e.message || e)); return null; });
  return me.ready;
}
async function miniShow(model, src, flip) {
  const r = await engine.analyse(model, src, { flip });
  const c = miniEl("miniOut"); if (!c || !mini || mini.model !== model) return null;
  engine.render(c, src, r.dets, model); c.hidden = false;
  return r.dets.length;
}
/* why a camera did not open, in words */
function camWhy(e) {
  const n = e && e.name;
  return n === "NotAllowedError" || n === "SecurityError" ? t("camDenied")
    : n === "NotFoundError" || n === "OverconstrainedError" ? t("camNone")
    : n === "NotReadableError" || n === "AbortError" ? t("camBusy")
    : t("camErr") + ((e && (e.message || e.name)) || e);
}
/* the camera opens at once and shows itself while the model downloads; the
   detections start when it is ready, drawn over the moving video (a phone
   that takes a second a frame still shows smooth video). Phones start on the
   back camera. */
let miniFacing = matchMedia("(pointer: coarse)").matches ? "environment" : "user";
async function miniCam() {
  if (mini && (mini.live || mini.opening)) return miniStop();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return miniSay(t("camNoApi"));
  const ready = miniModel(); const me = mini;
  const ticket = ++me.cam; me.opening = true; me.note = "";
  miniEl("miniCam").textContent = t("miniCamOff");
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: miniFacing }, width: { ideal: 960 }, height: { ideal: 540 } }, audio: false }); }
  catch (e) {
    if (mini === me && me.cam === ticket) { me.opening = false; miniEl("miniCam").textContent = t("miniCam"); miniSay(me.note = camWhy(e)); }
    return;
  }
  if (mini !== me || me.cam !== ticket) { stream.getTracks().forEach((tr) => tr.stop()); return; }   // stopped or switched meanwhile
  me.opening = false;
  // in the page (out of sight), not detached: Safari draws a detached video black
  const video = Object.assign(document.createElement("video"), { muted: true, playsInline: true, autoplay: true, className: "vh" });
  video.setAttribute("playsinline", ""); video.srcObject = stream;
  miniEl("mini").append(video);
  me.live = { stream, video, loop: null };
  try { await video.play(); } catch (e) { miniStop(); miniSay(camWhy(e)); return; }
  navigator.mediaDevices.enumerateDevices().then((ds) => { const f = miniEl("miniFlip"); if (f) f.hidden = ds.filter((x) => x.kind === "videoinput").length < 2; }).catch(() => {});
  if (!engine) engine = await import("./js/engine.js");
  if (mini !== me || !me.live) return;
  let model = me.model || null; ready.then((m) => { model = m; });
  const c = miniEl("miniOut"); c.hidden = false;
  me.live.loop = engine.live({ video, canvas: c, max: 960, getModel: () => model,
    onResult: ({ dets, fps }) => { if (mini === me && me.live) miniSay(`${t("miniFound").replace("{n}", dets.length)}${fps ? " · " + fps.toFixed(1) + " fps" : ""}`); },
    onError: (e) => { console.error(e); if (mini === me) { miniStop(); miniSay(t("miniErr") + (e.message || e)); } } });
}
async function miniPicture(file) {
  if (mini && (mini.live || mini.opening)) miniStop();
  const model = await miniModel(); if (!model) return;
  const img = new Image(); img.src = URL.createObjectURL(file);
  try { await img.decode(); } catch { miniSay(t("miniErr") + file.name); return; }
  const src = engine.frame(img, 1280); URL.revokeObjectURL(img.src);
  const t0 = performance.now();
  try {
    const n = await miniShow(model, src, true);
    if (n !== null) miniSay(`${t("miniFound").replace("{n}", n)} · ${Math.round(performance.now() - t0)} ms`);
  } catch (e) { console.error(e); miniSay(t("miniErr") + (e.message || e)); }
}
/* the webcam stops on any redraw; ``all`` also lets the model go */
function miniStop(all = false) {
  if (mini) {
    mini.cam++; mini.opening = false;
    if (mini.live) {
      mini.live.loop?.stop(); mini.live.stream.getTracks().forEach((tr) => tr.stop());
      mini.live.video.remove(); mini.live = null;
    }
    const b = miniEl("miniCam"); if (b) b.textContent = t("miniCam");
    const f = miniEl("miniFlip"); if (f) f.hidden = true;
  }
  if (all && mini) { mini.model?.release(); mini = null; }
}

  if (e.target.closest("#miniFlip")) { miniFacing = miniFacing === "user" ? "environment" : "user"; miniStop(); return miniCam(); }
  const a = e.target.closest("a[data-files]");
  if (a) { e.preventDefault(); fetchFiles(a.dataset.files.split(" "), a); }
});

/* Hugging Face sends big files (.onnx, .bin, .pt) as downloads but shows small
   text ones (.xml, .json) in the browser: those are fetched and saved here. */
function save(blob, name) {
  const u = URL.createObjectURL(blob);
  const x = document.createElement("a"); x.href = u; x.download = name; document.body.append(x); x.click(); x.remove();
  setTimeout(() => URL.revokeObjectURL(u), 30000);
}
/* several files (a detector and the network beside it, or OpenVINO's three)
   come as one zip: a browser lets a page start one download per click */
const CRC = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(entries) {               // [{name, data: Uint8Array}] -> Blob, stored (no compression)
  const enc = new TextEncoder(), parts = [], dir = []; let offset = 0;
  for (const { name, data } of entries) {
    const n = enc.encode(name), crc = crc32(data), size = data.length;
    const h = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [8, 0, 2], [14, crc, 4], [18, size, 4], [22, size, 4], [26, n.length, 2]]
      .forEach(([o, val, w]) => w === 4 ? h.setUint32(o, val, true) : h.setUint16(o, val, true));
    parts.push(h, n, data);
    const c = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [16, crc, 4], [20, size, 4], [24, size, 4], [28, n.length, 2], [42, offset, 4]]
      .forEach(([o, val, w]) => w === 4 ? c.setUint32(o, val, true) : c.setUint16(o, val, true));
    dir.push(c, n);
    offset += 30 + n.length + size;
  }
  const dirSize = dir.reduce((k, x) => k + x.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [8, entries.length, 2], [10, entries.length, 2], [12, dirSize, 4], [16, offset, 4]]
    .forEach(([o, val, w]) => w === 4 ? e.setUint32(o, val, true) : e.setUint16(o, val, true));
  return new Blob([...parts, ...dir, e], { type: "application/zip" });
}
async function grab(url, onBytes) {
  const r = await fetch(url); if (!r.ok) throw new Error(r.status);
  const reader = r.body.getReader(), chunks = []; let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; onBytes(got); }
  const out = new Uint8Array(got); let o = 0; for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}
let zipping = false;
async function fetchFiles(files, card) {
  const { d, v, sizes } = current;
  if (files.length === 1) {
    const x = document.createElement("a"); x.href = `${RAW}/${v.key}/${files[0]}?download=true`; x.download = files[0];
    document.body.append(x); x.click(); x.remove(); return;
  }
  if (zipping) return; zipping = true;
  const total = files.reduce((n, f) => n + (f === SAM_ENCODER.name ? SAM_ENCODER.size : sizes[f] || 0), 0); let before = 0;
  // the files come in whole before the zip can be saved: the card shows how far
  const small = card && card.querySelector("small"), was = small && small.textContent;
  const show = (pct) => {
    if (!card) return;
    card.classList.add("busy"); card.style.setProperty("--p", `${pct}%`);
    small.textContent = t("zipping").replace("{p}", pct);
  };
  show(0);
  try {
    const entries = [];
    for (const f of files) {
      let data;
      try {
        data = await grab(f === SAM_ENCODER.name ? SAM_ENCODER.url : `${RAW}/${v.key}/${f}`,
          (got) => show(total ? Math.min(99, Math.round(100 * (before + got) / total)) : 0));
      } catch (err) {
        if (!f.endsWith(".names.json")) throw err;  // older models: the names from the list
        data = new TextEncoder().encode(JSON.stringify(d.meta.classes || {}));
      }
      before += data.length; entries.push({ name: f, data });
    }
    save(zipStore(entries), files[0].replace(/\.(onnx|xml)$/, "") + ".zip");
    toast(t("zipped").replace("{n}", files.length));
  } catch { toast(t("zipFail")); }
  finally {
    zipping = false;
    if (card) { card.classList.remove("busy"); card.style.removeProperty("--p"); small.textContent = was; }
  }
}
$("detail").addEventListener("close", () => { miniStop(true); current = null; history.replaceState(null, "", location.pathname + location.search); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q") && !$("detail").open) { e.preventDefault(); $("q").focus(); }
});
applyLang();
load();
</script>
