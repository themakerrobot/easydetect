    licence: "데이터 라이선스", wLicence: "가중치 라이선스", wFrom: "출발 모델:", source: "출처", credit: "표기", cite: "인용", note: "참고",
    classesAll: "클래스", onHF: "Hugging Face에서 파일 보기", px: "px", noTorch: "PyTorch 없이", close: "닫기",
    fOnnx: "ONNX", fOnnxS: "모든 CPU", fInt8: "ONNX 8비트", fInt8S: "라즈베리파이", fOv: "OpenVINO", fOvS: "인텔 CPU · GPU · NPU", fPt: "PyTorch", fPtS: "이어서 학습",
    rf: "Roboflow 100", cWebcam: "웹캠으로 바로", cList: "목록과 점수",
    cFile: "받아 둔 파일이면 그 경로", cHub: "이름으로: 한 번만 받아요",
    tAll: "모든 타입", detect: "감지", segment: "세그멘테이션", pose: "포즈",
    mDetect: "mAP50-95", mSegment: "마스크 mAP50-95", mPose: "OKS AP", boxScore: "상자 mAP50-95",
    fHead: "{0}와 함께 받아요. 한 폴더에 두세요", cBeside: "{0}가 같은 폴더에 있어야 해요",
    anyMask: "어느 모델이든 task=\"segment\"로 범용 마스크를 만들 수 있어요(MobileSAM, 이 데이터셋으로 학습·채점 안 함).",
  },
};
let lang = (() => { try { return localStorage.getItem("hub.lang"); } catch { return null; } })()
  || ((navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "en");
const t = (k) => (T[lang] && T[lang][k]) ?? T.en[k] ?? k;
const catName = (c) => (lang === "ko" ? CAT_KO[c] || c : c);
const S = { datasets: [], q: "", cat: "", task: "", sort: "name" };
/* a hub model's task: detect (boxes), segment (the detector and a mask decoder)
   or pose (the detector and a keypoint network), each in a folder of its own */
const TASKS = ["detect", "segment", "pose"];
const HEAD = { segment: "mask_decoder.onnx", pose: "pose.onnx" };
const METRIC = { detect: "mDetect", segment: "mSegment", pose: "mPose" };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f3 = (v) => (typeof v === "number" ? v.toFixed(3) : "—");
function prettyName(id, title) {
  if (id.startsWith("rf100-")) {                     // rf100-chess-pieces-mjzgj -> Chess pieces
    let n = id.slice(6).replace(/-(?=[a-z0-9]{5}$)(?=.*\d)[a-z0-9]{5}$/, "");
    n = n.replace(/-/g, " ").replace(/\bx ray\b/i, "X-ray").replace(/\bmri\b/i, "MRI").replace(/\bpcb\b/i, "PCB");
    return n.charAt(0).toUpperCase() + n.slice(1);
  }
  return title.split(" (")[0].replace(" Dataset", "");
}
function shortLicence(text) {
  const s = String(text || "").trim(); const head = s.split(/ \(|;/)[0].trim();
  return head === s ? head : head + " *";
}
function fmtSize(n) {
  if (!n) return ""; const u = ["B", "KB", "MB", "GB"]; let i = 0;
  while (n >= 1000 && i < 3) { n /= 1000; i++; }
  return (n >= 100 || !i ? n.toFixed(0) : n.toFixed(1)) + " " + u[i];
}
let toastTimer;
function toast(s) { const e = $("toast"); e.textContent = s; e.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove("on"), 1600); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const a = document.createElement("textarea"); a.value = text; document.body.append(a); a.select();
    try { document.execCommand("copy"); } catch {} a.remove(); }
  toast(t("copied"));
}

/* ---------- code with tabs ---------- */
function highlight(code) {
  return esc(code)
    .replace(/(^|\n)(#[^\n]*)/g, '$1<span class="c">$2</span>')
    .replace(/(  #[^\n]*)/g, '<span class="c">$1</span>')
    .replace(/(&quot;[^&]*?&quot;)/g, '<span class="s">$1</span>')
    .replace(/\b(from|import)\b/g, '<span class="k">$1</span>');
}
function term(id, tabs) {
  const box = $(id);
  box.dataset.tabs = JSON.stringify(tabs);
  const on = Math.min(Number(box.dataset.on || 0), tabs.length - 1);
  box.innerHTML = `<div class="tabs">${tabs.map((tb, i) =>
    `<button type="button" class="db${i === on ? " on" : ""}" data-i="${i}">${esc(tb[0])}</button>`).join("")}</div>
    <div class="code"><pre>${highlight(tabs[on][1])}</pre><button type="button" class="db copy">${esc(t("copy"))}</button></div>`;
  box.dataset.on = on;
}
document.addEventListener("click", (e) => {
  const box = e.target.closest(".term"); if (!box) return;
  const tabs = JSON.parse(box.dataset.tabs || "[]");
  const tb = e.target.closest(".tabs .db");
  if (tb) { box.dataset.on = tb.dataset.i; term(box.id, tabs); return; }
  if (e.target.closest(".copy")) copy(tabs[Number(box.dataset.on || 0)][1]);
});
function pythonCode(hub, file, task = "detect") {
  const arg = task === "detect" ? "" : `, task="${task}"`;
  const beside = HEAD[task] ? `\n# ${t("cBeside").replace("{0}", HEAD[task])}` : "";
  return `from easydetect import Detector\n\n# ${t("cHub")}\nmodel = Detector("${hub}")\n# ${t("cFile")}${beside}\n# model = Detector("${file}"${arg})\n\nresult = model("photo.jpg")[0]\nresult.show()`;
}
function heroTerm() {
  term("hero-term", [
    [t("python"), `# pip install -U easydetect  (${t("noTorch")})\n` + pythonCode("hub:taco/ed-s-640", "ed-s-640.onnx")],
    [t("cli"), `pip install -U easydetect\n\n# ${t("cWebcam")}\neasydetect predict model=hub:taco/ed-s-640 source=0\n\n# ${t("cList")}\neasydetect hub search=plant`],
    [t("pi"), `pip install easydetect\n\nfrom easydetect import Detector\nmodel = Detector("hub:coco/ed-s-320-int8", backend="onnxruntime")\nmodel("photo.jpg")[0].save("out.jpg")`],
  ]);
}

/* ---------- data ---------- */
async function load() {
  $("grid").innerHTML = '<div class="skel"></div>'.repeat(8);
  try {
    const res = await fetch(`${RAW}/index.json`, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const by = new Map();
    for (const [key, m] of Object.entries(await res.json())) {
      const [id, variant] = key.split("/");
      if (!by.has(id)) by.set(id, { id, variants: [], meta: m });
      const task = m.task || "detect";
      by.get(id).variants.push({ key, name: variant, ...m, task,
        score: m.score ?? m.map50_95, score_int8: m.score_int8 ?? m.map50_95_int8 });
    }
    S.datasets = [...by.values()].map((d) => {
      d.variants.sort((a, b) => TASKS.indexOf(a.task) - TASKS.indexOf(b.task) || (a.imgsz || 0) - (b.imgsz || 0));
      d.tasks = TASKS.filter((k) => d.variants.some((v) => v.task === k));
      d.meta = (d.variants.find((v) => v.task === "detect") || d.variants[0]);
      d.title = d.meta.title || d.id; d.name = prettyName(d.id, d.title); d.rf = d.id.startsWith("rf100-");
      d.category = d.meta.category || "Other";
      d.classes = Object.values(d.meta.classes || {}).map(String);
      d.of = (task, size) => d.variants.find((v) => v.task === task && v.imgsz === size);
      return d;
    });
    renderAll();
    const want = decodeURIComponent(location.hash.slice(1));
    if (want && want !== "models") openDetail(want);
  } catch (e) {
    $("grid").innerHTML = `<div class="empty err">${esc(t("err"))} (${esc(e.message)}) ·
      <a href="${HF}/${REPO}" target="_blank" rel="noopener">${esc(t("open"))}</a></div>`;
  }
}
function hay(d) { return [d.id, d.name, d.title, d.category, CAT_KO[d.category] || "", ...d.tasks, ...d.tasks.map((k) => T.ko[k]), ...d.classes].join(" ").toLowerCase(); }

/* ---------- list ---------- */
function renderAll() { renderFacts(); renderTasks(); renderChips(); renderGrid(); }
const shown = () => S.task || "detect";
function best(d) { return Math.max(0, ...d.variants.filter((v) => v.task === shown()).map((v) => v.score || 0)); }
function renderTasks() {
  const count = (k) => S.datasets.filter((d) => d.tasks.includes(k)).length;
  const have = TASKS.filter((k) => count(k));
  $("tasks").hidden = have.length < 2;
  $("tasks").innerHTML = [`<button type="button" class="db${S.task ? "" : " on"}" data-task="">${esc(t("tAll"))}</button>`,
    ...have.map((k) => `<button type="button" class="db${S.task === k ? " on" : ""}" data-task="${k}">${esc(t(k))} <small>${count(k)}</small></button>`)].join("");
}
function renderFacts() {
  const n = S.datasets.length;
  const models = S.datasets.reduce((k, d) => k + d.variants.length, 0);
  $("facts").innerHTML = `<div><b>${n || "—"}</b><span>${esc(t("datasets"))}</span></div>
    <div><b>${models || "—"}</b><span>${esc(t("models"))}</span></div><div><b>0</b><span>${esc(t("torch"))}</span></div>`;
}
function renderChips() {
  const count = new Map();
  const pool = S.datasets.filter((d) => !S.task || d.tasks.includes(S.task));
  for (const d of pool) count.set(d.category, (count.get(d.category) || 0) + 1);
  $("chips").innerHTML = [`<button type="button" class="db${S.cat ? "" : " on"}" data-cat="">${esc(t("all"))} <small>${pool.length}</small></button>`,
    ...ORDER.filter((c) => count.has(c)).map((c) => `<button type="button" class="db${S.cat === c ? " on" : ""}" data-cat="${esc(c)}">${esc(catName(c))} <small>${count.get(c)}</small></button>`)].join("");
}
function sc(v, size) {
  if (!v) return `<div class="sc none"><div class="l">${size} ${t("px")}</div><div class="v">—</div><div class="track"></div><div class="i8">&nbsp;</div></div>`;
  const i8 = typeof v.score_int8 === "number" ? `${esc(t("int8"))} ${f3(v.score_int8)}` : "&nbsp;";
  return `<div class="sc"><div class="l">${size} ${t("px")}</div><div class="v">${f3(v.score)}</div>
    <div class="track"><div class="fill" style="width:${Math.round((v.score || 0) * 100)}%"></div></div><div class="i8">${i8}</div></div>`;
}
function renderGrid() {
  const words = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list = S.datasets.filter((d) => (!S.task || d.tasks.includes(S.task)) && (!S.cat || d.category === S.cat)
    && (!words.length || words.every((w) => hay(d).includes(w))));
  list.sort(S.sort === "score" ? (a, b) => best(b) - best(a)
          : S.sort === "classes" ? (a, b) => b.classes.length - a.classes.length
          : (a, b) => ORDER.indexOf(a.category) - ORDER.indexOf(b.category) || a.rf - b.rf || a.name.localeCompare(b.name));
  $("grid").innerHTML = list.length ? list.map((d) => `
    <button type="button" class="card" data-id="${esc(d.id)}" aria-label="${esc(d.name)}">
      <div class="thumb"><img loading="lazy" alt="" src="${RAW}/${encodeURIComponent(d.id)}/thumb.jpg" onerror="this.remove()">
        <span class="badge">${esc(catName(d.category))}</span>${d.rf ? `<span class="badge r">RF100</span>` : ""}</div>
      <div class="body">
        <div><h3>${esc(d.name)}</h3><div class="names">${d.classes.length} ${esc(t("classes"))} · ${esc(d.classes.slice(0, 6).join(", "))}</div></div>
        <div class="scores">${sc(d.of(shown(), 320), 320)}${sc(d.of(shown(), 640), 640)}</div>
        <div class="meta"><span>${esc(shortLicence(d.meta.license))}</span><span>${d.tasks.map((k) => esc(t(k))).join(" · ")}</span></div>
      </div>
    </button>`).join("") : `<div class="empty">${esc(t("none"))}</div>`;
}

/* ---------- detail ---------- */
let current = null;
async function sizesOf(key) {
  try {
    const r = await fetch(`${HF}/api/models/${REPO}/tree/main/${key.split("/").map(encodeURIComponent).join("/")}`);
    if (!r.ok) return {};
    return Object.fromEntries((await r.json()).map((e) => [e.path.split("/").pop(), (e.lfs && e.lfs.size) || e.size || 0]));
  } catch { return {}; }
}
function openDetail(id, size, task) {
  const d = S.datasets.find((x) => x.id === id); if (!d) return;
  task = task || (S.task && d.tasks.includes(S.task) ? S.task : d.tasks[0]);
  const mine = d.variants.filter((x) => x.task === task);
  const v = (size && mine.find((x) => x.imgsz === size)) || mine.find((x) => x.imgsz === 640) || mine.at(-1);
  current = { d, v, sizes: {} };
  history.replaceState(null, "", "#" + encodeURIComponent(id));
  drawDetail();
  if (!$("detail").open) $("detail").showModal();
  sizesOf(v.key).then((s) => { if (current && current.v === v) { current.sizes = s; drawFiles(); } });
}
function fileCard(kind, files, label, sub, main) {
  const { v, sizes } = current;
  const total = files.reduce((n, f) => n + (sizes[f] || 0), 0);
  return `<a class="file${main ? " main" : ""}" href="${RAW}/${v.key}/${files[0]}?download=true" data-files="${esc(files.join(" "))}" download>
    <span class="ic">${esc(kind)}</span><span><b>${esc(label)}</b><small>${esc(sub)}${total ? " · " + fmtSize(total) : ""}</small></span></a>`;
}
function drawFiles() {
  const { v } = current; const n = v.name;
  const have = new Set(v.files || []); const has = (f) => !have.size || have.has(f);
  const box = $("files"); if (!box) return;
  // a mask or keypoint model is its detector and the network beside it: both come
  const head = HEAD[v.task] ? [HEAD[v.task]] : [];
  const sub = (s) => head.length ? `${s} · ${t("fHead").replace("{0}", head[0])}` : s;
  box.innerHTML = [
    has(`${n}.onnx`) ? fileCard("ONNX", [`${n}.onnx`, ...head], t("fOnnx"), sub(t("fOnnxS")), true) : "",
    has(`${n}-int8.onnx`) && v.score_int8 != null ? fileCard("INT8", [`${n}-int8.onnx`, ...head], t("fInt8"), sub(t("fInt8S"))) : "",
    has(`${n}.xml`) ? fileCard("OV", [`${n}.xml`, `${n}.bin`, `${n}.names.json`, ...head], t("fOv"), sub(t("fOvS"))) : "",
    has(`${n}.pt`) ? fileCard("PT", [`${n}.pt`], t("fPt"), t("fPtS")) : "",
  ].join("");
}
function drawDetail() {
  const { d, v } = current; const m = d.meta; const hub = `hub:${d.id}/${v.name}`;
  const src = /^https?:\/\//.test(m.source || "") ? m.source : "";
  const i8 = v.score_int8 != null;
  const task = v.task; const arg = task === "detect" ? "" : `, task="${task}"`;
  const fileNote = `# ${t("cFile")}` + (HEAD[task] ? ` (${HEAD[task]})` : "");
  const sizes = d.variants.filter((x) => x.task === task);
  $("detail").innerHTML = `<div class="dl">
    <div class="ph"><div class="grow"><h2>${esc(d.name)}</h2>
      <div class="k"><span class="badge">${esc(catName(d.category))}</span>${d.rf ? `<span>${esc(t("rf"))}</span>` : ""}<code>${esc(hub)}</code></div></div>
      ${d.tasks.length > 1 ? `<div class="row">${d.tasks.map((k) => `<button type="button" data-task="${k}" class="db${k === task ? " on" : ""}">${esc(t(k))}</button>`).join("")}</div>` : ""}
      ${sizes.length > 1 ? `<div class="row">${sizes.map((x) => `<button type="button" data-size="${x.imgsz}" class="db${x === v ? " on" : ""}">${x.imgsz} ${t("px")}</button>`).join("")}</div>` : ""}
      <button type="button" class="hbtn" id="close" aria-label="${esc(t("close"))}">✕</button></div>
    <div class="cols">
    <aside class="left">
      <img alt="" src="${RAW}/${encodeURIComponent(d.id)}/thumb.jpg" onerror="this.style.visibility='hidden'">
      <div class="info">
        <div><div class="pb-label">${esc(t("licence"))}</div>${esc(m.license || "")}<div class="hint" style="margin-top:4px">${esc(t("licNote"))}</div></div>
        <div><div class="pb-label">${esc(t("wLicence"))}</div>Apache-2.0<div class="hint" style="margin-top:4px">${esc(t("wFrom"))} ${esc((v.built_from || ["D-FINE (Apache-2.0)", "PP-HGNetV2 from PaddleDetection (Apache-2.0)", ...(v.task === "segment" ? ["MobileSAM (Apache-2.0)"] : [])]).join(", "))} · <a href="https://github.com/themakerrobot/easydetect/blob/main/NOTICE" target="_blank" rel="noopener">NOTICE</a></div></div>
        ${src ? `<div><div class="pb-label">${esc(t("source"))}</div><a href="${esc(src)}" target="_blank" rel="noopener">${esc(src.replace(/^https?:\/\//, ""))}</a></div>` : ""}
        ${m.attribution ? `<div><div class="pb-label">${esc(t("credit"))}</div>${esc(m.attribution)}</div>` : ""}
        ${m.citation ? `<div><div class="pb-label">${esc(t("cite"))}</div>${esc(m.citation)}</div>` : ""}
        ${m.note ? `<div><div class="pb-label">${esc(t("note"))}</div>${esc(m.note)}</div>` : ""}
        <div><div class="pb-label">${esc(t("classesAll"))} · ${d.classes.length}</div><div class="tags">${d.classes.map((c) => `<span class="tag">${esc(c)}</span>`).join("")}</div></div>
        <div><a href="${HF}/${REPO}/tree/main/${esc(v.key)}" target="_blank" rel="noopener">${esc(t("onHF"))} ↗</a></div>
      </div>
    </aside>
    <div class="right">
      <div class="kpis">
        <div class="kpi"><div class="l">${esc(t(METRIC[task]))}</div><div class="v">${f3(v.score)}</div></div>
        ${i8 ? `<div class="kpi"><div class="l">${esc(t("int8"))}</div><div class="v">${f3(v.score_int8)}</div></div>` : ""}
        ${task !== "detect" && typeof v.map50_95 === "number" ? `<div class="kpi"><div class="l">${esc(t("boxScore"))}</div><div class="v">${f3(v.map50_95)}</div></div>` : ""}
        ${typeof v.conf === "number" ? `<div class="kpi"><div class="l">${esc(t("conf"))}</div><div class="v">${v.conf}</div></div>` : ""}
        <div class="kpi"><div class="l">${esc(t("classesAll"))}</div><div class="v">${d.classes.length}</div></div>
      </div>
      <div><div class="pb-label">${esc(t("download"))}</div><div class="files" id="files"></div></div>
      <div><div class="pb-label">${esc(t("useIt"))}</div><div class="term" id="dterm"></div>
        ${!d.tasks.includes("segment") ? `<p class="hint">${esc(t("anyMask"))}</p>` : ""}</div>
    </div></div></div>`;
  drawFiles();
  const n = v.name;
  term("dterm", [
    [t("python"), `# pip install -U easydetect\n` + pythonCode(hub, `${n}.onnx`, task)],
    [t("cli"), `easydetect predict model=${hub} source=photo.jpg\n# ${t("cWebcam")}\neasydetect predict model=${hub} source=0\n${fileNote}\neasydetect predict model=${n}.onnx${arg ? ` task=${task}` : ""} source=photo.jpg`],
    ...(i8 ? [[t("pi"), `Detector("${hub}-int8", backend="onnxruntime")\n${fileNote}\nDetector("${n}-int8.onnx"${arg}, backend="onnxruntime")`]] : []),
    [t("npu"), `Detector("${hub}.xml", device="NPU")\n${fileNote} (.bin, .names.json)\nDetector("${n}.xml"${arg}, device="NPU")`],
    [t("tune"), `pip install -U "easydetect[train]"\n\nmodel = Detector("${hub}.pt")\n${fileNote}\n# model = Detector("${n}.pt")\nmodel.train(data="my_data.yaml", epochs=50, imgsz=${v.imgsz})`],
    [t("folder"), `hf download ${REPO} --include "${v.key}/*" --local-dir hub`],
  ]);
}

/* ---------- events ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  $("lang").textContent = lang === "ko" ? "EN" : "한국어";
  document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll("[data-t-html]").forEach((e) => { e.innerHTML = t(e.dataset.tHtml); });
  $("q").placeholder = t("search");
  $("sort").innerHTML = `<option value="name">${esc(t("sortName"))}</option><option value="score">${esc(t("sortScore"))}</option><option value="classes">${esc(t("sortClasses"))}</option>`;
  $("sort").value = S.sort;
  heroTerm(); renderFacts();
  if (S.datasets.length) { renderAll(); if ($("detail").open && current) drawDetail(); }
}
$("lang").addEventListener("click", () => { lang = lang === "ko" ? "en" : "ko"; try { localStorage.setItem("hub.lang", lang); } catch {} applyLang(); });
let qt; $("q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(() => { S.q = $("q").value; renderGrid(); }, 90); });
$("sort").addEventListener("change", () => { S.sort = $("sort").value; renderGrid(); });
$("chips").addEventListener("click", (e) => { const b = e.target.closest(".db"); if (!b) return; S.cat = b.dataset.cat; renderChips(); renderGrid(); });
$("tasks").addEventListener("click", (e) => { const b = e.target.closest(".db"); if (!b) return; S.task = b.dataset.task; S.cat = ""; renderTasks(); renderChips(); renderGrid(); });
$("grid").addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c) openDetail(c.dataset.id); });
$("detail").addEventListener("click", (e) => {
  if (e.target === $("detail") || e.target.closest("#close")) return $("detail").close();
  const k = e.target.closest("[data-task]"); if (k) return openDetail(current.d.id, current.v.imgsz, k.dataset.task);
  const s = e.target.closest("[data-size]"); if (s) return openDetail(current.d.id, Number(s.dataset.size), current.v.task);
  const a = e.target.closest("a[data-files]");
  if (a) { e.preventDefault(); fetchFiles(a.dataset.files.split(" ")); }
});

/* Hugging Face sends big files (.onnx, .bin, .pt) as downloads but shows small
   text ones (.xml, .json) in the browser: those are fetched and saved here. */
function save(blob, name) {
  const u = URL.createObjectURL(blob);
  const x = document.createElement("a"); x.href = u; x.download = name; document.body.append(x); x.click(); x.remove();
  setTimeout(() => URL.revokeObjectURL(u), 30000);
}
async function fetchFiles(files) {
  const { d, v } = current;
  for (const [i, f] of files.entries()) {
    if (i) await new Promise((r) => setTimeout(r, 700));
    const url = `${RAW}/${v.key}/${f}`;
    if (/\.(xml|json)$/.test(f)) {
      try {
        const r = await fetch(url);
        if (r.ok) { save(await r.blob(), f); continue; }
      } catch {}
      if (f.endsWith(".names.json")) {           // older models: the names from the list
        save(new Blob([JSON.stringify(d.meta.classes || {})], { type: "application/json" }), f);
        continue;
      }
    }
    const x = document.createElement("a"); x.href = url + "?download=true"; x.download = f;
    document.body.append(x); x.click(); x.remove();
  }
  if (files.length > 1) toast(t("savedN").replace("{n}", files.length));
}
$("detail").addEventListener("close", () => { current = null; history.replaceState(null, "", location.pathname + location.search); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q") && !$("detail").open) { e.preventDefault(); $("q").focus(); }
});
applyLang();
load();
</script>
